async function saveHosp(orig) {
  const name = $('#f_name').value.trim();
  if (!name) throw new Error('請填醫院全名');
  const coord = parseCoord($('#f_coord').value);
  if (!coord) throw new Error('座標格式錯誤，例：25.0143, 121.4635');
  if (state.hospitals.some(h => h.name === name && (!orig || h.id !== orig.id))) throw new Error('已有同名醫院');
  const caps = checkedVals('#modalBody input[name="cap"]');
  const paused = checkedVals('#modalBody input[name="paused"]').filter(c => caps.includes(c));
  const fld = (attr, c) => { const el = $(`#modalBody [${attr}="${CSS.escape(c)}"]`); return el ? el.value : ''; };
  const limits = {};
  caps.forEach(c => {
    const when = normWhen(fld('data-when', c)), note = fld('data-note', c).trim();
    if (when && when !== 'ask') { const g = parseHours(when); if (!g || !g.length) throw new Error(`「${capName(c)}」的時段看不懂，請寫成「一至五 08:00-17:00」或留白`); }
    if (when || note) limits[c] = { when, note };
  });
  const table = {};
  TABLE_CATS.forEach(cat => {
    const m = [0, 1, 2].map(i => { const el = $(`#modalBody select[data-mk="${cat.id}"][data-i="${i}"]`); return el ? el.value : '-'; }).join('');
    const ta = $(`#modalBody textarea[data-tt="${cat.id}"]`), t = ta ? ta.value.trim() : '';

  });
  const item = normHosp({
    ...(orig || {}), id: orig ? orig.id : uid('h'), name, short: $('#f_short').value.trim(), level: $('#f_level').value,
    addr: $('#f_addr').value.trim(), tel: $('#f_tel').value.trim(), lat: coord.lat, lng: coord.lng, caps, paused, limits, table,
    note: $('#f_note').value.trim(), verified: $('#f_verified').checked, updatedAt: Date.now()
  });
  await Store.save('hospitals', item);
  closeModal(); toast('已儲存'); renderAdminPanel();
}
async function deleteHosp(h) {
  if (!confirm(`確定刪除「${h.short || h.name}」？`)) return;
  await Store.remove('hospitals', h.id);
  const touched = state.rules.filter(r => r.groups.some(g => g.include.includes(h.id) || g.exclude.includes(h.id)))
    .map(r => normRule({ ...r, groups: r.groups.map(g => ({ ...g, include: g.include.filter(x => x !== h.id), exclude: g.exclude.filter(x => x !== h.id) })) }));

function mtRules() { return [...state.rules].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name)); }
function needText(g) {
  if (g.caps.length) return g.caps.map(capName).join(g.mode === 'any' ? ' 或 ' : '＋') + (g.minLevel ? `（${g.minLevel}以上）` : '');
  if (g.minLevel) return g.minLevel + '以上';

  return '不限（最近的急救責任醫院）';
}
function ruleNeedText(r) {
  return r.groups.map(g => { const c = groupCondText(g).replace(/[（）]/g, ''); return (c ? c + '：' : '') + needText(g); }).join('｜') || '尚未設定';
}
// 不看時段，只看醫院「有沒有」這些處置（長期停用的不算）
function groupHasHosp(h, g) {
  if (g.exclude.includes(h.id)) return false;
  if (g.include.includes(h.id)) return true;
  if (!g.caps.length && !g.minLevel) return g.include.length === 0;
  if (g.minLevel && levelRank(h.level) < levelRank(g.minLevel)) return false;
  if (g.caps.length) {
    const has = c => h.caps.includes(c) && !h.paused.includes(c);
    return g.mode === 'any' ? g.caps.some(has) : g.caps.every(has);
  }
  return true;
}
function grpKey(g) { const n = normGroup(g); return JSON.stringify({ ...n, caps: [...n.caps].sort() }); }
function mtDirty() {
  const d = state.mtDraft; if (!d) return false;
  const o = state.rules.find(r => r.id === d.id); if (!o) return false;
  return o.groups.length !== d.groups.length || o.groups.some((g, i) => grpKey(g) !== grpKey(d.groups[i]));
}

/* ----- CSV / JSON ----- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const CSV_HEAD = ['名稱', '簡稱', '等級', '地址', '電話', '緯度', '經度', '能力', '已驗證', '備註'];
const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function hospToCsvRow(h) {
  return [h.name, h.short, h.level, h.addr, h.tel, h.lat ?? '', h.lng ?? '', h.caps.map(capName).join('、'), h.verified ? '是' : '', h.note].map(csvCell).join(',');
}
async function importHospCsv(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error('CSV 沒有資料列');
  const head = rows[0].map(s => s.trim());
  const idx = k => head.indexOf(k);
  if (idx('名稱') < 0 || idx('緯度') < 0 || idx('經度') < 0) throw new Error('CSV 需有「名稱、緯度、經度」欄位，請用範本');
  const get = (r, k) => (idx(k) >= 0 ? (r[idx(k)] || '').trim() : null);
  const capLookup = name => {
    const n = name.trim().toLowerCase(); if (!n) return null;
    const c = state.caps.find(c => c.id.toLowerCase() === n || c.name.toLowerCase() === n);
    return c ? c.id : undefined;
  };
  const out = [], warn = [];
  rows.slice(1).forEach((r, i) => {
    const line = i + 2, name = get(r, '名稱');
    if (!name) { warn.push(`第 ${line} 列：沒有名稱，略過`); return; }
    const lat = numOrNull(get(r, '緯度')), lng = numOrNull(get(r, '經度'));
    if (lat == null || lng == null) { warn.push(`第 ${line} 列「${name}」：座標錯誤，略過`); return; }
    const orig = state.hospitals.find(h => h.name === name) || out.find(h => h.name === name);
    const capsRaw = get(r, '能力');
    let caps = orig ? orig.caps : [];
    if (capsRaw !== null) {
      caps = [];
      capsRaw.split(/[、\/;|；]+/).forEach(s => {
        const id = capLookup(s);
        if (id) { if (!caps.includes(id)) caps.push(id); }
        else if (id === undefined) warn.push(`第 ${line} 列：找不到能力「${s.trim()}」`);
      });
    }
    const pick = (k, def) => { const v = get(r, k); return v === null ? def : v; };
    const lvl = pick('等級', orig ? orig.level : '');
    const ver = get(r, '已驗證');
    out.push(normHosp({
      ...(orig || {}), id: orig ? orig.id : uid('h'), name,
      short: pick('簡稱', orig ? orig.short : ''), level: LEVELS.find(l => l === lvl || (lvl && l[0] === lvl[0] && lvl.length <= 3)) || '',
      addr: pick('地址', orig ? orig.addr : ''), tel: pick('電話', orig ? orig.tel : ''), lat, lng, caps,
      paused: orig ? orig.paused.filter(c => caps.includes(c)) : [],
      verified: ver === null ? (orig ? orig.verified : false) : /^(是|y|yes|1|true|v|✓)$/i.test(ver),
      note: pick('備註', orig ? orig.note : ''), updatedAt: Date.now()
    }));
  });
  if (!out.length) throw new Error('沒有可匯入的資料\n' + warn.slice(0, 8).join('\n'));
  const uniq = [...new Map(out.map(h => [h.id, h])).values()];
  const nNew = uniq.filter(h => !state.hospitals.some(x => x.id === h.id)).length;
  if (!confirm(`將新增 ${nNew} 間、更新 ${uniq.length - nNew} 間醫院。${warn.length ? `\n\n注意：\n${warn.slice(0, 8).join('\n')}${warn.length > 8 ? `\n…等 ${warn.length} 項` : ''}` : ''}\n\n確定匯入？`)) return;
  await Store.saveMany('hospitals', uniq);
  toast(`匯入完成：${uniq.length} 間`); renderAdminPanel();
}

  return new Promise(resolve => {
    const inp = $(inputSel); inp.value = '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      const rd = new FileReader(); rd.onload = () => resolve(String(rd.result)); rd.onerror = () => resolve(null);
      rd.readAsText(f, 'utf-8');
    };
    inp.click();
  });
}

/* ========== 事件 ========== */
function setCaseText(t) { $('#caseText').value = t; state.caseText = t; onCaseInput(); }
const ACTIONS = {
  menu: () => { $('#menu').hidden = !$('#menu').hidden; },
  go: el => { $('#menu').hidden = true; const to = el.dataset.to || ''; if (location.hash === to || (!location.hash && !to)) route(); else location.hash = to; },
  localSettings: () => { $('#menu').hidden = true; openLocalSettings(); },
  pickTheme: el => { $$('#ls_theme button').forEach(b => b.classList.toggle('on', b === el)); },
  aiTest: () => testAi(),
  // 不 await：AI 分析期間其他按鈕仍可操作
  aiRun: () => { if (!aiReady()) throw new Error('請先在本機設定輸入 Gemini 金鑰'); const t = state.caseText.trim(); if (!t) throw new Error('請先輸入案件摘要'); AI.run(t); },
  aiCaps: () => {
    const r = state.ai.result; if (!r || !r.suggestedCaps.length) return;
    state.quickCaps = new Set(r.suggestedCaps); state.tab = 'quick'; renderTabs(); renderQuickCaps(); renderResults();
    if (!state.searched) toast('已選好建議能力，按「查詢鄰近醫院」');
  },
  tab: el => { state.tab = el.dataset.tab; renderTabs(); renderResults(); },
  qcap: el => { const id = el.dataset.id; state.quickCaps.has(id) ? state.quickCaps.delete(id) : state.quickCaps.add(id); renderQuickCaps(); renderResults(); },
  qclear: () => { state.quickCaps.clear(); renderQuickCaps(); renderResults(); },
  sex: el => { state.patient.sex = state.patient.sex === el.dataset.v ? '' : el.dataset.v; renderPatient(); renderParse(); renderResults(); },
  complaint: el => { state.patient.ruleId = state.patient.ruleId === el.dataset.id ? '' : el.dataset.id; renderPatient(); renderParse(); renderResults(); maybeAutoSearch(); },
  jump: () => jumpToResults(),
  // 示範案例 = 新案件：清掉上一個案件的欄位
  demoCase: el => {
    const c = DEMO_CASES[Number(el.dataset.i)]; if (!c) return;
    if (c.story) return storyDemo();
    if (state.scn) { state.scn = null; renderScnBar(); renderHeroPills(); }
    AI.cancel(); state.ai = { state: 'idle' }; state.lastParsed = null; state.patient = { sex: '', age: '', ruleId: '' };
    resetClock();
    setCaseText(c.text);
  },
  pasteCase: async () => {
    const ta = $('#caseText'); let t = null;
    try { if (navigator.clipboard && navigator.clipboard.readText) t = await navigator.clipboard.readText(); } catch (e) { t = null; }
    if (t == null) { ta.focus(); throw new Error('無法讀取剪貼簿，請長按輸入框選「貼上」'); }
    if (!t.trim()) throw new Error('剪貼簿是空的');
    setCaseText(t);
  },
  clearCase: () => {
    AI.cancel(); if (Speech.on) Speech.stop();
    state.caseText = ''; state.lastParsed = null; state.parsed = null; state.kwParsed = null; state.ai = { state: 'idle' };
    state.patient = { sex: '', age: '', ruleId: '' };
    resetClock();
    $('#caseText').value = '';
    renderPatient(); renderParse(); renderAi(); renderResults();
    toast('已清除，可貼上新案件');
  },
  onsetAgo: el => setOnset(Date.now() - Number(el.dataset.m) * 60e3, 'manual'),
  onsetUnknown: () => { state.clock.unknown = !state.clock.unknown; if (state.clock.unknown) { state.clock.onsetAt = null; state.clock.src = 'manual'; } renderClockBox(); renderResults(); },
  fmcNow: () => { state.clock.fmcAt = Date.now(); renderClockBox(); renderResults(); },
  mciType: el => { state.mci.type = el.dataset.v; state.mci.result = null; renderMci(); },
  mciStep: el => { const c = el.dataset.c; state.mci[c] = Math.max(0, Math.min(200, state.mci[c] + Number(el.dataset.d))); state.mci.result = null; renderMci(); },
  mciRun: () => mciRun(),
  showNotice: () => { $('#menu').hidden = true; showNotice(); },
  randomCase: () => randomScenario(),
  endScn: () => endScenario(),
  hospTable: el => { closeModal(); openHospTable(el.dataset.id); },
  applyTable: async () => {
    if (!confirm(`套用「${DEFAULT_TABLE_SRC}」？\n\n・19 間急救責任醫院的能力、時段限制與原文說明會更新（林口長庚也會加入）\n・你在「主訴配對」改過的配對、自己新增的主訴都會保留\n・舊版的臺北、基隆、桃園測試醫院會移除\n・你改過的電話、座標、備註會保留`)) return;
    const d = tableUpgrade({ caps: state.caps, hospitals: state.hospitals, rules: state.rules, settings: state.settings }, true);
    d.settings = normSettings({ ...state.settings, tableSrc: DEFAULT_TABLE_SRC });
    await Store.replaceAll(d); state.presetDraft = null; toast('已套用能力表'); renderAdminPanel();
  },
  statRange: el => { state.statRange = Number(el.dataset.v); renderStats(); },
  statDemo: () => { const r = genDemoHistory(30); toast(`已產生示範數據：查詢 ${r.logs} 筆、通知 ${r.notices} 筆`); renderStats(); },
  statClearDemo: () => { if (!confirm('清除這台裝置上的示範數據？')) return; writeLS(DEMO_HIST_KEY, { logs: [], notices: [] }); toast('已清除'); renderStats(); },
  makeHandover: el => makeHandover(el.dataset.id),
  mic: () => Speech.toggle(),
  mciNotify: () => mciNotify(),
  sortBy: el => { localCfg.sortBy = el.dataset.v === 'dist' ? 'dist' : 'rec'; saveLocalCfg(); renderResults(); },
  openMap: el => { const h = hospById(el.dataset.id); if (h) openExternal(mapsUrl(h)); },
  toggleMap: () => { localCfg.showMap = !localCfg.showMap; saveLocalCfg(); renderResults(); },
  focusCard: el => {
    const c = document.getElementById('card-' + el.dataset.id); if (!c) return;
    if (lmap) lmap.closePopup();
    c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  },
  notify: el => openNoticeModal(el.dataset.id),
  moreCaps: el => { const id = el.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); renderResults(); },
  cancelNotice: async el => { if (!confirm('取消這筆到院前通知？')) return; await Store.updateNotice(el.dataset.id, { status: 'cancelled' }); toast('已取消'); },
  dismissNotice: el => { localCfg.dismissed = [...localCfg.dismissed, el.dataset.id].slice(-100); saveLocalCfg(); renderNoticeBar(); },
  hpLogin: async () => {
    const email = $('#hpEmail').value.trim(), pw = $('#hpPw').value;
    if (!email || !pw) throw new Error('請輸入 Email 和密碼');
    await Store.login(email, pw); toast('已登入');
  },
  hpStep: el => {
    const d = state.hp.draft; if (!d) return;
    const k = el.dataset.k; d[k] = Math.max(0, Math.min(999, (d[k] || 0) + Number(el.dataset.d)));
    if (k === 'resusMax' && d.resus != null && d.resus > d.resusMax && d.resusMax > 0) d.resus = d.resusMax;
    hpChanged();
  },
  hpFull: () => { const d = state.hp.draft; if (!d) return; d.erFull = !d.erFull; hpChanged(); toast(d.erFull ? '已通報急診滿載' : '已解除滿載'); },
  hpCap: el => {
    const d = state.hp.draft; if (!d) return; const id = el.dataset.id, s = el.dataset.s;
    if (s === 'ok') delete d.caps[id];
    else d.caps[id] = { state: s, until: Math.ceil((Date.now() + 60 * 60e3) / 300e3) * 300e3, note: '' };
    hpChanged();
  },
  hpUntil: el => {
    const d = state.hp.draft; if (!d || !d.caps[el.dataset.id]) return; const m = Number(el.dataset.m);
    d.caps[el.dataset.id].until = m ? Math.ceil((Date.now() + m * 60e3) / 300e3) * 300e3 : null;
    hpChanged();
  },
  hpBoardMode: () => {
    state.hp.board = !state.hp.board; renderHospital();
    if (state.hp.board && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    else if (!state.hp.board && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  },
  hpTouch: () => { hpChanged(false); toast('已確認目前數值'); },
  hpAccept: async el => { await Store.updateNotice(el.dataset.id, { status: 'accepted', reply: '可收治，已準備', repliedAt: Date.now() }); toast('已回覆：可收治'); },
  hpDecline: el => openDeclineModal(el.dataset.id),
  login: async () => {
    const email = $('#loginEmail').value.trim(), pw = $('#loginPw').value;
    if (!email || !pw) throw new Error('請輸入 Email 和密碼');
    await Store.login(email, pw); toast('已登入');
  },
  logout: async () => { await Store.logout(); toast('已登出'); },
  atab: el => { if (state.adminTab === 'settings' && el.dataset.tab !== 'settings') state.presetDraft = null; state.adminTab = el.dataset.tab; renderAdminPanel(); },
  hAdd: () => openHospEditor(null),
  hEdit: el => openHospEditor(el.dataset.id),
  rAdd: () => openRuleEditor(null),
  rEdit: el => openRuleEditor(el.dataset.id),
  mtPick: el => mtSwitch(el.dataset.id),
  mtCap: el => mtToggleCap(Number(el.dataset.gi), el.dataset.c),
  mtMode: el => mtSetMode(Number(el.dataset.gi), el.dataset.v),
  mtSave: () => mtSave(),
  mtReset: () => mtReset(),
  capAdd: () => openCapEditor(null),
  capEdit: el => openCapEditor(el.dataset.id),
  groupAdd: () => { syncRuleDraft(); state.ruleDraft.groups.push(normGroup({})); rerenderGroups(); },
  groupDel: el => {
    syncRuleDraft();
    if (state.ruleDraft.groups.length <= 1) throw new Error('至少要保留一個條件組');
    state.ruleDraft.groups.splice(Number(el.dataset.gi), 1); rerenderGroups();
  },
  userAdd: async () => {
    const email = $('#u_email').value.trim().toLowerCase(), hid = $('#u_hid').value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Email 格式錯誤');
    if (!hid) throw new Error('請選擇醫院');
    await Store.setHospitalUser(email, hid); toast('已綁定'); renderUsersPanel();
  },
  userDel: async el => { if (!confirm(`解除 ${el.dataset.email} 的綁定？`)) return; await Store.removeHospitalUser(el.dataset.email); toast('已解除'); renderUsersPanel(); },
  presetAdd: () => { syncPresetDraft(); state.presetDraft.push({ name: '', lat: '', lng: '' }); rerenderPresets(); },
  presetDel: el => { syncPresetDraft(); state.presetDraft.splice(Number(el.dataset.i), 1); rerenderPresets(); },
  setSave: () => saveSettingsForm(),
  textsDefault: () => { $('#s_disc').value = DEFAULT_TEXTS.disclaimer; $('#s_notice').value = DEFAULT_TEXTS.notice; $('#s_credit').value = DEFAULT_TEXTS.credit; toast('已填入預設文字，按「儲存設定」才會生效'); },
  csvTpl: () => download('醫院匯入範本.csv', '﻿' + CSV_HEAD.join(',') + '\n' +
    ['範例醫院', '範例', '重度級', '新北市板橋區某路1號', '(02)12345678', '25.0143', '121.4635', 'CT、高壓氧、Trauma team', '是', ''].map(csvCell).join(',') + '\n', 'text/csv'),
  exportCsv: () => download(`醫院資料_${new Date().toISOString().slice(0, 10)}.csv`,
    '﻿' + CSV_HEAD.join(',') + '\n' + state.hospitals.map(hospToCsvRow).join('\n') + '\n', 'text/csv'),
  importCsv: async () => { const t = await pickFile('#fileCsv'); if (t != null) await importHospCsv(t); },
  exportJson: () => download(`醫院查詢備份_${new Date().toISOString().slice(0, 10)}.json`,
    JSON.stringify({ app: 'ems-hospital-navigator', version: APP_VERSION, exportedAt: new Date().toISOString(),
      caps: state.caps, hospitals: state.hospitals, rules: state.rules, settings: state.settings }, null, 2), 'application/json'),
  importJson: async () => { const t = await pickFile('#fileJson'); if (t != null) await importJsonBackup(t); },
  clearLive: async () => { if (!confirm('清除所有醫院回報的設備狀態與到院前通知？')) return; await Store.clearLive(); toast('已清除'); },
  seed: async () => { if (!confirm('寫入預設測試資料到雲端？')) return; await Store.replaceAll(seedData()); state.presetDraft = null; toast('已寫入'); renderAdminPanel(); },
  resetDemo: async () => { if (!confirm('清除此裝置上的修改，恢復預設測試資料？')) return; await Store.replaceAll(seedData()); state.presetDraft = null; if (localCfg.sim) { Sim.stop(); Sim.start(); } toast('已重設'); renderAdminPanel(); },
  modalClose: () => closeModal(),
  modalBtn: el => { const b = state.modalBtns[Number(el.dataset.i)]; if (b) return b.onClick(); }
};

let busy = false;
async function runAction(el, e) {
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (busy) return;
  busy = true;
  try { await fn(el, e); }
  catch (err) { console.warn(err); toast((err && err.message) || String(err), 4500); }
  finally { busy = false; }
}
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-act="menu"]')) $('#menu').hidden = true;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = e.target.closest('a[href]');
  if (a && a !== el && el.contains(a)) { if (a.classList.contains('disabled')) e.preventDefault(); return; }
  runAction(el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.h-card[data-act]')) { e.preventDefault(); runAction(e.target, e); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.change === 'onlyMatch') { state.onlyMatch = t.checked; renderResults(); }
  if (t.id === 'locSource') onLocSourceChange(t.value);
  if (t.id === 'lkSel') { localCfg.lkId = t.value; saveLocalCfg(); renderLookupBody(); }
  if (t.id === 'lkAll') { localCfg.lkAll = t.checked; saveLocalCfg(); renderLookupBody(); }
  if (t.id === 'mtSel') mtSwitch(t.value);
  if (t.dataset && t.dataset.mt === 'lv') mtSetLevel(Number(t.dataset.gi), t.value);
  if (t.id === 'onsetTime' && t.value) setOnset(onsetFromKey('clock:' + t.value), 'manual');
  if (t.id === 'hpSelect') {
    state.hp.hid = t.value; try { localStorage.setItem(HP_HID_KEY, t.value); } catch (er) { /* ignore */ }
    startHpNoticeWatch(); loadHpDraft(); renderHospital();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ageInput') { state.patient.age = t.value; renderParse(); renderResults(); }
  if (t.id === 'caseText') { state.caseText = t.value; onCaseInput(); }
  if (t.id === 'hSearch') { state.hSearch = t.value; renderHospList(); }
  if (t.id === 'hpNote' && state.hp.draft) { state.hp.draft.note = t.value; hpChanged(false); }
  if (t.id === 'mciNote') state.mci.note = t.value;
  if (t.dataset && t.dataset.mt === 'label') mtSetLabel(Number(t.dataset.gi), t.value);
});
$('#btnSearch').addEventListener('click', doSearch);
// 隱藏入口：連點標題 5 下進後台
let tapN = 0, tapT = 0;
$('#brand').addEventListener('click', () => {
  const now = Date.now(); tapN = now - tapT < 600 ? tapN + 1 : 1; tapT = now;
  if (tapN >= 5) { tapN = 0; location.hash = isRoute('#admin') ? '' : '#admin'; }
});
window.addEventListener('hashchange', () => { closeModal(); route(); });
setInterval(renderClock, 15000);
window.addEventListener('scroll', () => { if (isRoute('') && state.searched) renderJump(); }, { passive: true });
// 時間窗倒數：有設定發作時間時每 20 秒更新
setInterval(() => { if (isRoute('') && activeProtocol() && state.clock.onsetAt != null) { renderClockBox(); if (state.searched) renderResults(); } }, 20000);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (localCfg.theme === 'auto') updateMapTiles(); }); } catch (e) { /* 舊版瀏覽器 */ }
// 每分鐘更新「幾分鐘前」、忙碌倒數等時間顯示
setInterval(() => { if (isRoute('') && state.searched) renderResults(); if (isRoute('#lookup')) renderLookupBody(); if (isRoute('#hospital')) { renderHpNotices(); renderHpSync(); } }, 60000);
// 來院看板倒數：每 10 秒
setInterval(() => { if (isRoute('#hospital')) renderHpBoard(); }, 10000);

/* ========== 啟動 ========== */
// 離線模式：只有 https（GitHub Pages）才能註冊
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('離線模式無法啟用', e)));
}
window.addEventListener('online', () => { renderNet(); toast('已恢復連線'); });
window.addEventListener('offline', () => { renderNet(); toast('目前離線：可繼續用上次的醫院資料查詢，設備狀態與通知會在恢復連線後更新', 5000); });
async function boot() {
  applyTheme();
  await Store.init();
  try {
    const d = await withTimeout(Store.loadAll(), 10000);
    applyData(d); state.dataSource = d.source;
  } catch (e) {
    console.warn(e);
    const c = readLS(CACHE_KEY);
    if (c && Array.isArray(c.hospitals)) { applyData(c); state.dataSource = 'cache'; state.cachedAt = c.cachedAt; toast('無法連線資料庫，使用上次同步的離線資料', 4000); }
    else { applyData({ caps: [], hospitals: [], rules: [], settings: SEED_SETTINGS }); state.dataSource = 'none'; toast('資料載入失敗：' + e.message, 5000); }
  }
  Store.watchStatus(m => {
    const out = {}; for (const [k, v] of Object.entries(m || {})) out[k] = normStatus(v);
    state.status = out; onLiveChange();
  });
  if (SHOW_CAPACITY && localCfg.sim) Sim.start();
  Tracker.start();
  await Store.authReady;
  if (Store.mode === 'demo') startEmsNoticeWatch();
  route();
}
boot();
</script>
