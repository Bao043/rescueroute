<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B28" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="救途">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>救途 RescueRoute｜救護送醫導航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D3302A'/%3E%3Cpath d='M10 34h11l5-12 8 22 5-10h15' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   設計：救護車塗裝 —— 白色車身、紅黃反光條紋、車身字樣般的窄體數字
   ========================================================= */
:root{
  --paper:#F4F1EB; --surface:#FFFDF9; --field:#FAF7F1; --sunken:#EAE5DC;
  --ink:#0F1B28; --ink2:#2C3A49; --muted:#5D6A77; --dim:#959DA6;
  --line:#E5DFD4; --line2:#D0C8BA;
  --red:#D3302A; --red2:#B2231E; --red-soft:#FBEAE7;
  --yellow:#F4B400; --amber:#985A00; --amber-soft:#FCF0D2;
  --green:#0C9A4C; --green-soft:#E4F5EA;
  --blue:#2160C4; --blue-soft:#E7EFFB;
  --violet:#5F42CC; --violet-soft:#EFEAFC;
  --on-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,27,40,.05),0 8px 24px rgba(15,27,40,.06);
  --shadow-lg:0 24px 60px rgba(15,27,40,.22);
  --r-sheet:20px; --r-ctl:12px; --r-chip:9px;
  --num:"Barlow Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
/* 夜班：深墨藍（自動跟隨系統，或在本機設定指定） */
:root[data-theme="dark"]{
  --paper:#0F1B28; --surface:#172738; --field:#132131; --sunken:#0B1520;
  --ink:#F1EDE5; --ink2:#C9CED3; --muted:#8B98A6; --dim:#5F6C7A;
  --line:#22344A; --line2:#30465E;
  --red:#FF5A4F; --red2:#FF7A70; --red-soft:rgba(255,90,79,.14);
  --yellow:#FFC53D; --amber:#FFBE47; --amber-soft:rgba(255,190,71,.13);
  --green:#3DD68C; --green-soft:rgba(61,214,140,.13);
  --blue:#72A9FF; --blue-soft:rgba(114,169,255,.14);
  --violet:#B7A1FF; --violet-soft:rgba(183,161,255,.14);
  --on-ink:#0F1B28;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B28; --surface:#172738; --field:#132131; --sunken:#0B1520;
    --ink:#F1EDE5; --ink2:#C9CED3; --muted:#8B98A6; --dim:#5F6C7A;
    --line:#22344A; --line2:#30465E;
    --red:#FF5A4F; --red2:#FF7A70; --red-soft:rgba(255,90,79,.14);
    --yellow:#FFC53D; --amber:#FFBE47; --amber-soft:rgba(255,190,71,.13);
    --green:#3DD68C; --green-soft:rgba(61,214,140,.13);
    --blue:#72A9FF; --blue-soft:rgba(114,169,255,.14);
    --violet:#B7A1FF; --violet-soft:rgba(183,161,255,.14);
    --on-ink:#0F1B28;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}

/* ---------- 頂欄＋反光條紋 ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--yellow) 10px 20px);background-size:28.28px 6px}
.topbar.run::after{animation:lights .5s linear infinite}
@keyframes lights{to{background-position:28.28px 0}}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;user-select:none;-webkit-user-select:none;cursor:pointer}
.logo{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--red)}
.logo .ic{width:21px;height:21px;stroke:#fff;stroke-width:2.6}
.brand-t{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;
  background:var(--field);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green)}.pill.warn{color:var(--amber)}.pill.bad{color:var(--red2)}.pill.info{color:var(--blue)}.pill.ai{color:var(--violet)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.menu{position:fixed;z-index:40;top:calc(64px + env(safe-area-inset-top));right:12px;min-width:230px;padding:6px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;background:none;color:var(--ink);
  font-size:15px;border-radius:10px;text-align:left;cursor:pointer;font-family:inherit}
.menu button:hover,.menu button.cur{background:var(--field)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
/* ---------- 主分頁：後送建議／醫院查詢 ---------- */
.topbar{flex-wrap:wrap;row-gap:8px}
.tb-break{order:8;flex-basis:100%;height:0}
.tb-break:has(+ .mtabs[hidden]){display:none}
.mtabs{order:9;flex:1 1 auto;max-width:560px;margin:0 auto;display:flex;gap:4px;padding:4px;background:var(--sunken);border-radius:14px}
.mtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:16px;font-weight:800;letter-spacing:1px;padding:9px 6px;border-radius:11px;cursor:pointer}
.mtabs button.on{background:#D3302A;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* ---------- 醫院查詢 ---------- */
.lk-pick select{font-size:17px;font-weight:700;padding:13px 40px 13px 14px}
.lk-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.lk-head{display:flex;flex-direction:column;gap:4px}
.lk-head h2{margin:0;font-size:22px;line-height:1.3}
.lk-head .full{font-size:13px;color:var(--muted)}
.lk-head .addr{font-size:14px;color:var(--ink2)}
.lk-act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lk-act .btn{padding:11px 6px}
.lk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lk-sum div{border-radius:12px;padding:10px 8px;text-align:center;background:var(--field)}
.lk-sum b{display:block;font-family:var(--num);font-size:28px;line-height:1.1}
.lk-sum span{font-size:12px;color:var(--muted)}
.lk-sum .ok b{color:var(--green)}.lk-sum .lim b{color:var(--amber)}.lk-sum .off b{color:var(--red)}
.lk-live{margin-top:12px;font-size:13px;color:var(--muted)}
.lk-live b{color:var(--ink)}
.lk-basis{font-size:12px;color:var(--muted);margin:2px 0 4px}
.lk-empty{text-align:center;color:var(--muted);padding:34px 14px}
.lk-empty .ic{width:34px;height:34px;color:var(--dim);margin-bottom:8px}
.lk-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (max-width:420px){.ht-row{grid-template-columns:118px 1fr;gap:10px}}
/* ---------- 後台：主訴配對 ---------- */
.mt-grp{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-top:14px;background:var(--field)}
.mt-gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.mt-gh b{font-size:15px}
.mt-caps{display:flex;flex-wrap:wrap;gap:6px}
.mt-cap{border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.mt-cap.on{background:#D3302A;border-color:#D3302A;color:#fff}
.mt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mt-prev{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.7}
.mt-prev b{color:var(--ink)}
.mt-prev.bad{color:var(--red)}
.mt-list .row-item.cur{border-color:#D3302A}
.mt-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.mt-foot [data-act="mtSave"]{flex:1 1 160px}
.mt-foot [data-act="mtSave"]:disabled{opacity:.55;cursor:default}
.mt-dirty{font-size:12px;font-weight:700;color:var(--amber)}
@media (max-width:420px){.mt-row{grid-template-columns:1fr}}
main{max-width:760px;margin:0 auto;padding:16px 14px 0}

/* ---------- 開場：時間 ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 4px 14px}
.clock{font-family:var(--num);font-weight:700;font-size:56px;line-height:.86;letter-spacing:.5px;color:var(--ink)}
.clock small{font-size:22px;color:var(--dim);margin-left:4px;font-weight:600}
.hero-r{text-align:right}
.hero-date{font-size:14px;color:var(--muted);font-weight:600}
.hero-pills{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- 區塊 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h b{font-size:16px;white-space:nowrap}
.sec-h .sub{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.label{font-size:13px;color:var(--muted);margin:14px 0 7px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:12px}
.hint:empty{display:none}
.hint.warn{color:var(--amber)}

/* ---------- 輸入 ---------- */
input,select,textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line2);
  border-radius:var(--r-ctl);padding:11px 12px;font-size:16px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--sunken)}
textarea{resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);padding:0}
input:disabled{opacity:.6}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);
  color:var(--ink);border-radius:var(--r-ctl);padding:10px 14px;font-size:15px;font-weight:650;text-decoration:none;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97);background:var(--field)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:active{background:var(--red2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red2);background:var(--red-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ai{border-color:transparent;color:var(--violet);background:var(--violet-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.disabled{opacity:.38;cursor:default} /* 不用 pointer-events:none，否則點擊會穿透到卡片 */
.btn-cta{position:relative;overflow:hidden;width:100%;margin-top:16px;border:0;border-radius:16px;color:#fff;cursor:pointer;font-family:inherit;
  font-size:19px;font-weight:800;letter-spacing:2px;padding:17px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--red);box-shadow:0 10px 24px -8px rgba(214,37,45,.55)}
.btn-cta:active{transform:scale(.985);background:var(--red2)}
.btn-cta:disabled{opacity:.7}
.btn-cta .ic{width:22px;height:22px;stroke-width:2.6}

/* ---------- 分段／選項 ---------- */
.seg{display:flex;gap:3px;background:var(--sunken);padding:3px;border-radius:13px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700;padding:10px 6px;
  border-radius:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.brand button.on{background:var(--ink);color:var(--on-ink)}
.seg.sex button{font-size:17px;padding:11px 0}
.seg.sex button.on{background:var(--ink);color:var(--on-ink)}
.seg.mini button{font-size:13px;padding:7px 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:var(--r-chip);
  padding:7px 11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s,color .12s}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.big{padding:9px 13px;font-size:15px}
.chip.alt{border-style:dashed;border-color:var(--violet);color:var(--violet)}
.chip .cdot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}
.cap-group{margin-bottom:12px}
.cap-gt{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px 2px}
.sel-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:12px 0 10px;min-height:28px}
.prow{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:end}
.loc-row{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--muted)}
.loc-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-row select{width:auto;max-width:52%;padding:7px 28px 7px 10px;font-size:13px}

/* ---------- 派遣內容 ---------- */
#caseText{min-height:70px;font-size:16px;line-height:1.55;background:var(--field)}
.demo-cases{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.demo-cases::-webkit-scrollbar{display:none}
.demo-cases .lbl{font-size:12px;color:var(--dim);white-space:nowrap;align-self:center}
.demo-cases .chip{font-size:12px;padding:5px 10px;white-space:nowrap;color:var(--muted)}
.parse{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.parse:empty{display:none}
.pv{padding:4px 11px;border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px}
.pv.miss{background:transparent;border:1px dashed var(--line2);color:var(--dim);font-weight:500}
.pv.manual{background:var(--amber-soft);color:var(--amber)}
.src{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.src.ai{background:var(--violet-soft);color:var(--violet)}
.parse .alt{width:100%;font-size:12px;color:var(--muted)}
.ai-box{margin-top:10px;border-radius:14px;padding:12px 13px;background:var(--violet-soft);font-size:14px}
.ai-box:empty{display:none}
.ai-box.plain{background:var(--field)}
.ai-h{display:flex;align-items:center;gap:6px;color:var(--violet);font-weight:800;font-size:13px}
.ai-reason{margin:6px 0 2px;color:var(--ink);font-size:15px}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ai-tags span{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--surface);color:var(--ink2)}
.sev{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
.sev.critical{background:var(--red);color:#fff}.sev.urgent{background:var(--yellow);color:#2a1b00}.sev.stable{background:var(--green);color:#fff}.sev.unknown{background:var(--sunken);color:var(--muted)}
.shimmer{animation:fade 1.1s ease-in-out infinite alternate}
@keyframes fade{from{opacity:1}to{opacity:.45}}

/* ---------- 結果 ---------- */
.res-head{display:flex;align-items:flex-end;gap:10px;margin:24px 4px 10px}
.res-t{flex:1;min-width:0}
.res-t b{display:block;font-size:22px;font-weight:800;letter-spacing:.5px}
.res-t > span{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-t span .ok{color:var(--green);font-weight:700}
.res-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 8px}
.res-ctl .seg{flex:1;max-width:320px}
.res-note{font-size:12px;color:var(--muted);margin:0 4px 10px}
.live{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--green)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.live.sim{color:var(--blue)}.live.sim i{background:var(--blue)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.switch input{width:18px;height:18px}
.hlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.tier{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:750;color:var(--muted);background:var(--field);border-top:1px solid var(--line)}
.tier:first-child{border-top:0}
.tier i{width:8px;height:8px;border-radius:2px;background:var(--dim)}
.tier.t0{color:var(--green)}.tier.t0 i{background:var(--green)}
.tier.t1{color:var(--amber)}.tier.t1 i{background:var(--yellow)}
.tier .n{margin-left:auto;font-family:var(--num);font-size:16px}
.h-card{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 12px;padding:15px 16px 14px 12px;
  border-top:1px solid var(--line);cursor:pointer;background:var(--surface);transition:background .12s}
.tier + .h-card,.hlist > .h-card:first-child{border-top:0}
.h-card:active{background:var(--field)}
.h-card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:transparent}
.h-card.match::before{background:var(--green)}
.h-card.match.full::before{background:var(--yellow)}
.h-card.dim .h-body,.h-card.dim .h-dist,.h-card.dim .h-rank{opacity:.55}
.h-card.flash{animation:flash 1.2s}
@keyframes flash{0%,100%{background:var(--surface)}30%{background:var(--blue-soft)}}
.h-rank{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.15;color:var(--dim);text-align:center}
.h-card.match .h-rank{color:var(--green)}.h-card.match.full .h-rank{color:var(--amber)}
.h-body{min-width:0}
.h-name{font-size:18px;line-height:1.3}
.h-name b{font-weight:800}
.h-lv{font-size:14px;font-weight:650;margin-left:2px}
.h-lv.l2{color:var(--red2)}.h-lv.l1{color:var(--amber)}.h-lv.l0{color:var(--blue)}.h-lv.lx{color:var(--muted)}
.h-caps{font-size:14px;color:var(--ink2);margin-top:5px;line-height:1.6}
.h-caps .k{color:var(--muted)}
.h-caps .req{color:var(--green);font-weight:750}
.h-caps .busy{color:var(--amber);font-weight:650}
.h-caps .down{color:var(--red2);text-decoration:line-through}
.h-caps .none{color:var(--dim)}
.more{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;font-weight:650;cursor:pointer;padding:0 0 0 6px}
.h-status{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:13px}
.match-line{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:750}
.h-card.full .match-line{color:var(--amber)}
.load{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.load i{width:8px;height:8px;border-radius:50%;background:currentColor}
.load.low{color:var(--green)}.load.mid{color:var(--amber)}.load.high{color:var(--red2)}.load.full{color:var(--red2)}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:13px;margin-top:6px}
.stats b{font-family:var(--num);font-size:17px;color:var(--ink);font-weight:700;margin-left:3px}
.stats b.hot{color:var(--red2)}.stats b.warm{color:var(--amber)}
.unv{font-size:12px;color:var(--dim)}
.h-note{font-size:13px;color:var(--amber);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.h-note.plain{color:var(--muted)}
.h-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.h-actions .srcline{margin-left:auto}
.srcline{font-size:12px;color:var(--dim)}
.h-dist{text-align:right;min-width:62px}
.h-dist b{font-family:var(--num);font-size:34px;font-weight:700;line-height:.95;letter-spacing:.3px}
.h-dist small{font-size:14px;color:var(--muted);margin-left:2px;font-weight:650}
.h-dist .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
.h-dist .go{display:inline-flex;align-items:center;gap:2px;font-size:12px;color:var(--blue);font-weight:650;margin-top:8px;white-space:nowrap}
.extra-note{font-size:14px;color:var(--amber);margin:6px 4px 8px;display:flex;gap:6px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.foot{font-size:12px;color:var(--dim);text-align:center;margin-top:20px;line-height:1.8}

/* ---------- 地圖 ---------- */
#mapWrap{border-radius:var(--r-sheet);overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--sunken);box-shadow:var(--shadow)}
#mapBox{height:52vh;min-height:300px}
.h-pin{display:grid!important;place-items:center;border-radius:50%;font-family:var(--num);font-weight:700;font-size:15px;color:#fff;
  background:#55657a;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.h-pin.match{background:var(--green)}.h-pin.full{background:var(--yellow);color:#2a1b00}.h-pin.dim{opacity:.55}
.me-pin span{display:block;width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px var(--blue-soft)}
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--ink)!important;border-radius:14px!important;box-shadow:var(--shadow-lg)!important}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{margin:12px 14px!important;font-family:var(--sans);font-size:14px}
.leaflet-container{font-family:var(--sans);background:var(--sunken)}
.pop b{font-size:15px}.pop .m{color:var(--muted);font-size:12px;margin:2px 0 8px}
.pop .btn{padding:6px 10px;font-size:13px;margin:2px 2px 0 0}

/* ---------- 到院前通知（救護端） ---------- */
.nbar{display:flex;flex-direction:column;gap:8px}
.nbar:not(:empty){margin-bottom:6px}
.nrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.nrow .t{flex:1;min-width:0}
.nrow .t b{display:block;font-size:15px}
.nrow .t small{color:var(--muted);font-size:12px}
.nrow.pending{border-color:var(--blue)}
.nrow.accepted{border-color:var(--green);background:var(--green-soft)}
.nrow.declined{border-color:var(--red);background:var(--red-soft)}
.nst{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap}
.nst.pending{background:var(--blue);color:#fff;animation:fade 1.2s ease-in-out infinite alternate}
.nst.accepted{background:var(--green);color:#fff}.nst.declined{background:var(--red);color:#fff}.nst.cancelled{background:var(--sunken);color:var(--muted)}

/* ---------- 醫院端 ---------- */
.hp-title{display:flex;align-items:center;gap:12px;margin:6px 2px 14px}
.hp-title .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.hp-title b{font-size:21px;display:block}
.hp-title small{color:var(--muted);font-size:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync.ok{color:var(--green)}.sync.saving{color:var(--blue)}.sync.err{color:var(--red2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:11px 11px 9px}
.tile .tl{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .tv{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tile .tv b{font-family:var(--num);font-size:38px;font-weight:700;line-height:1}
.tile .tv b small{font-size:18px;color:var(--muted)}
.step{display:flex;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.step button:active{background:var(--sunken)}
.mini-step{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.mini-step button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:14px;line-height:1;cursor:pointer;padding:0}
.bigtoggle{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:750;text-align:left}
.bigtoggle .sw{margin-left:auto;width:50px;height:30px;border-radius:999px;background:var(--sunken);position:relative;transition:.2s;flex:none}
.bigtoggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.bigtoggle.on{border-color:var(--red);background:var(--red-soft);color:var(--red2)}
.bigtoggle.on .sw{background:var(--red)}.bigtoggle.on .sw::after{left:23px}
.caprow{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.caprow:first-child{border-top:0}
.caprow .cn{flex:1;min-width:110px;font-weight:700;font-size:15px}
.caprow .cn small{display:block;font-size:12px;font-weight:600;color:var(--amber)}
.caprow .seg{flex:none}
.caprow .seg button{padding:7px 11px;font-size:13px}
.caprow .seg button.on.ok{background:var(--green);color:#fff}
.caprow .seg button.on.busy{background:var(--yellow);color:#2a1b00}
.caprow .seg button.on.down{background:var(--red);color:#fff}
.until{width:100%;display:flex;gap:6px;flex-wrap:wrap}
.until .btn{padding:5px 10px;font-size:12px}
.ncard{border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;background:var(--field)}
.ncard.pending{border:2px solid var(--blue);background:var(--blue-soft)}
.ncard .nh{display:flex;align-items:center;gap:8px}
.ncard .nh b{font-size:17px;flex:1}
.ncard .eta{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
.ncard .eta small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600}
.ncard .nb{font-size:15px;margin-top:8px;white-space:pre-wrap;color:var(--ink)}
.ncard .nm{font-size:12px;color:var(--muted);margin-top:8px}
.ncard .na{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ncard .na .btn{padding:12px}
.badge-n{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:inline-grid;place-items:center}

/* ---------- 後台 ---------- */
.admin-top{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.admin-top .who{flex:1;font-size:13px;color:var(--muted);min-width:120px}
.tabs-scroll{overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs-scroll .seg{min-width:max-content}
.tabs-scroll .seg button{white-space:nowrap;padding-left:14px;padding-right:14px}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.tools input{flex:1}
.row-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.row-item:active{background:var(--field)}
.row-item .main{flex:1;min-width:0}
.row-item .main b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-item .main small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.row-item .chev{color:var(--dim)}
.lv{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.lv.l2{background:var(--red-soft);color:var(--red2)}.lv.l1{background:var(--amber-soft);color:var(--amber)}.lv.l0{background:var(--blue-soft);color:var(--blue)}
.tagx{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.tagx.unv{border:1px dashed var(--line2);background:transparent;color:var(--dim)}
.form label{display:block;font-size:13px;color:var(--muted);margin:13px 0 5px;font-weight:600}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:var(--r-chip);padding:6px 11px;font-size:13px;cursor:pointer;margin:0!important;color:var(--ink)!important;font-weight:500!important;background:var(--surface)}
.chk input{width:17px;height:17px;margin:0}
.chk:has(input:checked){border-color:var(--ink);background:var(--sunken)}
.chk-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chk-gt{font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}
fieldset.grp{border:1px solid var(--line2);border-radius:14px;padding:6px 12px 12px;margin:14px 0}
fieldset.grp legend{padding:0 6px;font-weight:800;display:flex;gap:8px;align-items:center}
details{margin-top:10px}
summary{cursor:pointer;font-size:14px;color:var(--ink)}
.hosp-checks{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:10px}
.hosp-checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)!important;margin:0!important;font-weight:500!important}
.preset-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:6px;margin-bottom:8px}
.sec-title{font-weight:800;margin:2px 0 8px;font-size:16px}
.notice{font-size:13px;padding:11px 13px;border-radius:12px;background:var(--amber-soft);color:var(--amber);margin-bottom:12px}
.notice.info{background:var(--blue-soft);color:var(--blue)}
.notice.ai{background:var(--violet-soft);color:var(--violet)}
.btn-wrap{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}

/* ---------- 視窗／提示 ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,18,28,.5);display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--surface);width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media(min-width:800px){.modal{align-items:center}.modal-box{border-radius:22px}}
.modal-head{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
.modal-head b{flex:1;font-size:17px}
.modal-head button{background:none;border:0;color:var(--muted);padding:4px;cursor:pointer}
.modal-body{padding:4px 16px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modal-foot .btn{flex:1;padding:12px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;max-width:90vw;text-align:center;box-shadow:var(--shadow-lg);white-space:pre-line}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}



/* ---------- 建議送往 ---------- */
.rec{position:relative;background:var(--surface);border:2px solid var(--green);border-radius:var(--r-sheet);box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:12px;overflow:hidden}
.rec::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(-45deg,var(--green) 0 10px,#7FD3A4 10px 20px)}
.rec.warn{border-color:var(--yellow)}
.rec.warn::before{background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#FFE08A 10px 20px)}
.rec.none{border-color:var(--red);display:flex;flex-direction:column;gap:4px}
.rec.none::before{background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--yellow) 10px 20px)}
.rec.none span{font-size:13px;color:var(--muted)}
.rec-k{font-size:13px;font-weight:800;color:var(--green);margin-top:4px}
.rec.warn .rec-k{color:var(--amber)}
.rec-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:2px}
.rec-name{border:0;background:none;padding:0;font:inherit;font-size:30px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1.15;text-align:left}
.rec-eta{text-align:right;white-space:nowrap}
.rec-eta b{font-size:52px;line-height:.9;font-weight:700}
.rec-eta small{font-size:16px;color:var(--muted);font-weight:700;margin-left:2px}
.rec-eta span{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.rec-why-ok{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.rec-why-ok li{display:flex;align-items:flex-start;gap:6px}
.rec-why-ok li .ic{margin-top:2px}
.rec-why-ok .ok{color:var(--green)}.rec-why-ok .warn{color:var(--amber)}.rec-why-ok .bad{color:var(--red2)}
.rec-why{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--field);font-size:13px;color:var(--ink2)}
.rec-why b{display:block;font-size:13px;margin-bottom:2px;color:var(--ink)}
.rec-act{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.rec-act .btn{padding:12px 6px}
.rec-alt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--muted)}
.rec-alt button{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
.jump{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;gap:6px;
  border:0;border-radius:999px;padding:12px 18px;background:var(--ink);color:var(--on-ink);font:inherit;font-size:15px;font-weight:650;box-shadow:var(--shadow-lg);cursor:pointer;white-space:nowrap;max-width:92vw}
.jump b{font-weight:800}
/* ---------- 危險徵象 ---------- */
.flags{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.flag{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:10px;background:var(--red-soft);color:var(--red2);font-size:14px;font-weight:700}
.flag .ic{margin-top:2px}
/* ---------- 時間窗 ---------- */
.tw{margin-top:16px;border:1px solid var(--line2);border-radius:16px;padding:14px;background:var(--field)}
.tw-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tw-h b{display:flex;align-items:center;gap:6px;font-size:15px}
.tw-el{font-family:var(--num);font-size:22px;font-weight:700;color:var(--red2)}
.tw-el.mute{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:600}
.tw-in{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:10px}
.tw-lbl{font-size:13px;color:var(--muted);font-weight:650}
.tw-in input{width:auto;max-width:150px;font-family:var(--num);font-size:20px;padding:7px 10px}
.tw-quick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.tw-quick .chip{font-size:13px;padding:5px 10px}
.tw-bar{position:relative;display:flex;height:12px;border-radius:6px;overflow:visible;margin:30px 2px 26px;background:var(--sunken)}
.tw-seg{height:100%}
.tw-seg:first-child{border-radius:6px 0 0 6px}.tw-seg:last-of-type{border-radius:0 6px 6px 0}
.tw-seg.s0{background:#2BB673}.tw-seg.s1{background:#F4B400}.tw-seg.s2{background:#F08A24}.tw-seg.s3{background:#D3302A}
.tw-tick{position:absolute;top:-4px;bottom:-4px;width:0}
.tw-tick i{position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--surface)}
.tw-tick em{position:absolute;top:22px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:650}
.tw-tick.end em{transform:translateX(-100%)}
.tw-lab{position:absolute;top:18px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;font-weight:650}
.tw-now,.tw-arr{position:absolute;top:-22px;width:0;z-index:2}
.tw-now i{position:absolute;left:-9px;top:0;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--ink)}
.tw-now::after{content:"";position:absolute;left:-1px;top:12px;width:2px;height:20px;background:var(--ink)}
.tw-arr i{position:absolute;left:-7px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--blue);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--blue)}
.tw-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-6px 0 8px}
.tw-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg-now{background:var(--ink)}.lg-arr{background:var(--blue)}
.tw-list{list-style:none;margin:6px 0 0;padding:0}
.tw-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.tw-list li:first-child{border-top:0}
.tw-list li b{white-space:nowrap;font-weight:750}
.tw-list li.past span{color:var(--dim);text-decoration:line-through}
.tw-list li.cur{color:var(--ink);font-weight:750}
.tw-list li.cur b{color:var(--red2)}
.tw-fmc{font-size:13px;color:var(--ink2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)}
.tw-ref{font-size:11px;color:var(--dim);margin-top:8px}
b.ok,span.ok{color:var(--green)}b.warn,span.warn{color:var(--amber)}b.bad,span.bad{color:var(--red2)}b.mute,span.mute{color:var(--dim)}
.h-win{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13px;font-weight:700}
.h-win span{display:inline-flex;align-items:center;gap:5px}
/* ---------- 洞察面板 ---------- */
.ix{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet);box-shadow:var(--shadow);padding:15px 16px;margin-bottom:12px}
.ix-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ix-h b{font-size:16px}
.ix-h span{font-size:14px;color:var(--green);font-weight:700}
.ix-h strong{font-family:var(--num);font-size:30px;margin:0 2px}
.ix-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin-top:8px}
.ix-l{grid-column:1/-1;font-size:13px;color:var(--ink2);font-weight:650}
.ix-track{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.ix-row > b{font-family:var(--num);font-size:20px}
.ix-seg{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.ix-seg em{font-style:normal;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;padding:0 4px}
.ix-seg.go{background:var(--blue)}.ix-seg.go2{background:#6F8FC9}.ix-seg.wait{background:repeating-linear-gradient(-45deg,var(--yellow) 0 6px,#E8A800 6px 12px)}
.ix-seg.wait em{color:#2a1b00}
.ix-sub{font-size:12px;font-weight:650;margin-top:3px;min-height:0}
.ix-sub:empty{display:none}
.ix-note{font-size:12px;color:var(--muted);margin-top:10px}
.ix-list{list-style:none;margin:0;padding:0}
.ix-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ix-list li:first-child{border-top:0}
.ix-list li span{color:var(--muted)}

/* ---------- 語音輸入／交班 ---------- */
#micBtn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:fade .9s ease-in-out infinite alternate}
.ho-h{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.ho-h label{margin-bottom:5px}
.ho{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.6;white-space:pre-wrap}
/* ---------- 大量傷病患 ---------- */
.mci-counts{display:flex;flex-direction:column;gap:8px}
.mci-c{display:grid;grid-template-columns:14px 28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--field);border:1px solid var(--line)}
.mci-c b{font-size:17px}.mci-c small{color:var(--muted);font-size:13px}
.mci-dot{width:14px;height:14px;border-radius:4px}
.mci-c.red .mci-dot{background:#D3302A}.mci-c.yellow .mci-dot{background:#F4B400}.mci-c.green .mci-dot{background:#0C9A4C}
.mci-c .step{align-items:center}
.mci-c .step span{min-width:44px;text-align:center;font-size:30px;font-weight:700}
.mci-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mci-sum div{background:var(--field);border-radius:12px;padding:10px;text-align:center}
.mci-sum b{display:block;font-family:var(--num);font-size:30px;line-height:1.1}
.mci-sum small{font-size:12px;color:var(--muted)}
.mci-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 12px;padding:14px 16px 14px 12px;border-top:1px solid var(--line)}
.mci-row:first-child{border-top:0}
.mci-main b{font-size:17px}
.mci-main small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.mci-got{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mci-pill{font-size:13px;font-weight:750;padding:2px 9px;border-radius:7px}
.mci-pill.red{background:#D3302A;color:#fff}.mci-pill.yellow{background:#F4B400;color:#2a1b00}.mci-pill.green{background:#0C9A4C;color:#fff}
#mciMapWrap{border-radius:var(--r-sheet);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow)}
#mciMap{height:40vh;min-height:260px;background:var(--sunken)}
.ix-note.bad{color:var(--red2);font-weight:650}
/* ---------- 醫院端來院看板 ---------- */
.hp-map{height:260px;border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--sunken)}
.hosp-pin{display:grid!important;place-items:center;border-radius:10px;background:var(--blue);color:#fff;font-weight:800;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.amb-pin{display:grid!important;place-items:center;border-radius:50%;background:var(--red);color:#fff;font-family:var(--num);font-weight:700;font-size:15px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.amb-pin.accepted{background:var(--green)}
.board-list{display:flex;flex-direction:column}
.bd-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bd-row:first-child{border-top:0}
.bd-i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:700}
.bd-row.accepted .bd-i{background:var(--green)}
.bd-m b{display:block;font-size:16px}.bd-m span{display:block;font-size:14px;color:var(--ink2)}.bd-m small{font-size:12px;color:var(--muted)}
.bd-t{font-family:var(--num);font-size:34px;font-weight:700;line-height:1;text-align:right}
.bd-t small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:650;margin-left:2px}
body.board main{max-width:1500px}
body.board .hp-picker,body.board #hpLive,body.board .notice.info{display:none}
body.board .hp-map{height:52vh}
body.board .bd-m b{font-size:22px}body.board .bd-m span{font-size:18px}body.board .bd-t{font-size:56px}
@media(min-width:1000px){body.board .hp-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}}
/* ---------- 數據分析 ---------- */
.stat-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:650}
.kpi b{display:block;font-size:34px;font-weight:700;line-height:1.15;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.sub-t{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line2)}
.col-c{flex:1;height:100%;display:flex;align-items:flex-end}
.col-b{position:relative;display:block;width:100%;max-width:24px;margin:0 auto;background:var(--blue);border-radius:4px 4px 0 0}
.col-b em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--ink);margin-bottom:3px}
.col-ax{position:relative;height:18px;font-size:11px;color:var(--muted)}
.col-ax span{position:absolute;transform:translateX(-50%);top:3px}
.hb{display:flex;flex-direction:column;gap:7px}
.hb-r{display:grid;grid-template-columns:minmax(80px,38%) minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.hb-k{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;min-width:0}
.hb-track{display:block;min-width:0}
.hb-b{display:block;height:14px;background:var(--blue);border-radius:0 4px 4px 0}
.hb-t b{font-size:15px;white-space:nowrap}
.stat-grid{display:grid;gap:0 14px}
@media(min-width:800px){.stat-grid{grid-template-columns:1fr 1fr}}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;color:var(--muted);font-weight:650;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{padding:6px}
.tbl .r{text-align:right}
.tbl .num{font-size:15px}
@media(max-width:480px){.tbl .hide-sm{display:none}}
.rate{display:inline-block;width:40px;height:8px;border-radius:4px;background:var(--sunken);vertical-align:middle;margin-right:6px;overflow:hidden}
.rate-b{display:block;height:100%;background:var(--blue);border-radius:4px}

/* ---------- 免責與署名 ---------- */
.rec-disc{display:flex;align-items:flex-start;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);font-size:12px;color:var(--muted);line-height:1.5}
.rec-disc .ic{margin-top:1px;flex:none}
.app-foot{margin:22px 4px 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.app-foot .disc{display:inline-flex;align-items:flex-start;gap:6px;text-align:left;max-width:36em}
.app-foot .disc .ic{margin-top:2px;flex:none}
.app-foot .credit{margin-top:6px;color:var(--dim);letter-spacing:.5px}
.app-foot .ver{margin-top:4px;color:var(--dim)}
.linkish{border:0;background:none;color:var(--blue);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.ack{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);color:var(--blue)}
.ack p{margin:0;color:var(--ink);font-size:15px}
.ack-list{margin:12px 0 0;padding-left:20px;font-size:15px;line-height:1.7;color:var(--ink2)}
.ack-list li{margin-bottom:8px}
.ack-credit{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}

/* ---------- 能力時段、限制 ---------- */
.h-caps .lim{font-size:11px;color:var(--amber);margin-left:2px;font-weight:650}
.h-caps .off{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2)}
.h-lim{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px}
.h-lim span{display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.h-lim .ic{margin-top:2px;flex:none}
.h-lim .ask{color:var(--amber)}.h-lim .info{color:var(--muted)}
.rec-why-ok li.info{color:var(--muted)}
.rec-alt.cond{color:var(--amber)}.rec-alt.cond span{font-size:12px;color:var(--muted);margin-left:6px}
.chip.dice{border-color:var(--amber);color:var(--amber);font-weight:750}
.chip.dice .ic{margin-right:4px}
.scn{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--line2)}
.scn > .ic{color:var(--amber);flex:none}
.scn .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.scn .t b{font-size:14px}.scn .t small{font-size:12px;color:var(--muted);line-height:1.45}
.scn .b{display:flex;gap:6px;flex:none}
@media (max-width:520px){.scn{flex-wrap:wrap}.scn .b{width:100%;justify-content:flex-end}}
/* ---------- 單一醫院能力表 ---------- */
.ht-head{display:flex;flex-direction:column;gap:3px;margin:14px 0 8px}
.ht-head b{font-size:15px}.ht-head span{font-size:13px;color:var(--muted)}
.ht-legend{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--field);line-height:1.5}
.ht-grp{margin:16px 0 4px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.ht-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ht-row.none{opacity:.55}
.ht-k{display:flex;flex-direction:column;gap:4px}
.ht-k b{font-size:14px}
.ht-m{display:flex;gap:3px}
.mk{font-style:normal;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;background:var(--field);color:var(--dim)}
.mk.y{color:var(--green);background:var(--green-soft)}.mk.s{color:var(--amber)}.mk.n{color:var(--red)}
.ht-v p{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
.cs-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cs{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--field);color:var(--muted)}
.cs.ok{background:var(--green-soft);color:var(--green)}.cs.lim{background:var(--amber-soft);color:var(--amber)}
.cs.ask{background:var(--amber-soft);color:var(--amber)}.cs.off{background:var(--red-soft);color:var(--red)}
.cs-note{font-size:12px;color:var(--muted);flex-basis:100%}
.ht-src{margin-top:14px;font-size:12px;color:var(--dim);line-height:1.6}
@media (max-width:520px){.ht-row{grid-template-columns:1fr;gap:6px}.ht-k{flex-direction:row;align-items:center;justify-content:space-between}}
/* ---------- 能力總表 ---------- */
#viewTable{max-width:1240px;margin:0 auto;padding:16px}
.mx-card{padding:16px}
.mx-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mx-top b{font-size:18px;display:block}.mx-top small{font-size:12px;color:var(--muted)}
.mx-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mx-legend span{display:inline-flex;align-items:center;gap:4px}

.mx-note{font-size:12px;color:var(--muted);margin:8px 0 12px}

.mx-t thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:12px;color:var(--muted);font-weight:750;white-space:nowrap}

.mx-t th.grp{border-bottom:1px solid var(--line2)}
.mx-t th.cat{white-space:normal;min-width:38px;max-width:52px;font-size:11.5px;line-height:1.25;padding:8px 3px;vertical-align:bottom;word-break:keep-all}
.mx-t th.hn{position:sticky;left:0;background:var(--surface);z-index:3;text-align:left;white-space:nowrap;padding-left:10px}
.mx-t tbody th.hn{z-index:1}
.mx-t th.hn button{border:0;background:none;font:inherit;font-weight:750;color:var(--ink);cursor:pointer;padding:0}
.mx-t tr.lvrow td{text-align:left;background:var(--field);padding:6px 10px;position:sticky;left:0}
.mx{min-width:34px}
td.mx[data-act]{cursor:pointer}
.dt{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;box-sizing:border-box}

.tc-ed{border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:0 12px}
.tc-ed[open]{padding-bottom:12px}

.tc-ed summary b{font-size:14px;flex:none}
.tc-sum{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.cap-ed input:not([type]){margin:0;padding:8px 10px;font-size:13px}
.cap-ed .chk{margin:0!important;justify-self:start}
.cap-ed .c-cap{font-weight:700!important}
.tc-marks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 6px}
.tc-marks span{font-weight:750;margin-right:4px}
.tc-marks select{width:auto;min-width:58px;margin:0 8px 0 2px;padding:4px 8px;font-size:14px}
.tc-ed textarea{font-size:13px}
@media (max-width:620px){.cap-ed{grid-template-columns:1fr auto;grid-template-areas:'c p' 'w w' 'n n';padding:8px 0;border-top:1px dashed var(--line)}
  .cap-ed .c-cap{grid-area:c}.cap-ed .c-pause{grid-area:p}.cap-ed .c-when{grid-area:w}.cap-ed .c-note{grid-area:n}}

/* ---------- 使用須知：資料說明 ---------- */
.ds-h{margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.ds-list{display:flex;flex-direction:column;gap:8px}
.ds-list div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px 12px;border-radius:12px;background:var(--field);font-size:13px;line-height:1.6}
.ds-list b{font-weight:800}.ds-list span{color:var(--ink2)}
.ds-list .real b{color:var(--green)}.ds-list .est b{color:var(--amber)}.ds-list .sim b{color:var(--red)}
/* ---------- 版面 ---------- */
@media(max-width:380px){.clock{font-size:46px}.h-dist b{font-size:29px}}
@media(min-width:1100px){
  /* 寬螢幕：分頁放在頂欄正中間，不另佔一行 */
  .tb-break{display:none}
  .mtabs{position:absolute;left:50%;top:calc(9px + env(safe-area-inset-top));transform:translateX(-50%);width:440px;margin:0}
  .mtabs[hidden]{display:none}
  #viewEms{max-width:1320px;display:grid;grid-template-columns:minmax(380px,450px) 1fr;gap:22px;align-items:start}
  .col-left{position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto;padding:0 4px 8px 0;scrollbar-width:thin}
  .col-right{min-width:0;padding-top:4px}
  #mapBox{height:44vh}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function normGroup(g = {}) {

function normWhen(w) {
  w = String(w || '').replace(/\s+/g, ' ').trim();

  if (/^(ask|有條件|先電話|請先|需確認)/i.test(w)) return 'ask';

}

/* ========== 資料存取（示範模式 / Firebase） ========== */
const Store = {

      }

/* ========== 車程（OSRM） ========== */
let etaSeq = 0;
async function fetchEta(origin, list) {
  const pool = list.slice(0, Math.min(list.length, Math.max(state.settings.listCount + 5, 25), 80)).map(x => x.h);
  if (!pool.length) return;
  const key = `${origin.lat.toFixed(4)},${origin.lng.toFixed(4)}|${pool.map(h => h.id).join(',')}`;
  if (state.etaKey === key && state.etaState === 'ok') return;
  const my = ++etaSeq;
  state.etaKey = key; state.etaState = 'loading'; state.eta = {};
  try {
    const coords = [origin, ...pool].map(p => `${p.lng.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
    const res = await fetchTimeout(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`, {}, 8000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (j.code !== 'Ok' || !j.durations) throw new Error(j.code || '格式錯誤');
    if (my !== etaSeq) return;
    pool.forEach((h, i) => {
      const d = j.durations[0][i + 1]; const m = j.distances ? j.distances[0][i + 1] : null;
      if (d != null) state.eta[h.id] = { min: Math.max(1, Math.round(d / 60)), km: m != null ? m / 1000 : null };
    });
    state.etaState = 'ok';
  } catch (e) {
    if (my !== etaSeq) return;
    console.warn('車程計算失敗', e); state.etaState = 'fail'; state.etaKey = '';
  }
  renderResults();
}

// 排序用的距離：有車程用車程分鐘，沒有就用直線距離
function distKey(x) { return x.eta && state.etaState === 'ok' ? x.eta.min * 1000 + x.d : x.d * 1e6; }
function computeList(hl) {
  const all = state.hospitals.filter(h => h.lat != null && h.lng != null)
    .map(h => ({ h, d: distKm(state.pos, h) })).sort((a, b) => a.d - b.d);
  all.forEach(x => {
    x.eta = state.eta[x.h.id] || null; x.m = hl.active ? hl.test(x.h) : null;
    x.st = liveStatus(x.h.id); x.load = loadLevel(x.st);
    x.win = windowInfo(x);
    x.lim = x.m ? reqLimits(x.h, hl) : []; x.cond = x.lim.some(l => l.kind === 'ask');
  });
  return all;
}
// 建議順序的分組：0 適合且可收治、1 適合但壅塞／滿載、2 適合但到院時已過時間窗、3 其他
function tierOf(x, hl) {
  const crowded = x.load === 'full' || x.load === 'high';
  if (hl.active) return x.m ? (x.win && x.win.closed ? 2 : crowded || x.cond ? 1 : 0) : 3;
  return x.load === 'full' ? 3 : 0;
}
function renderResults() {
  renderHint();
  const box = $('#results'), head = $('#resultsHead');
  $('#viewEms').classList.toggle('split', !!(state.searched && state.pos));
  if (!state.searched || !state.pos) { box.innerHTML = ''; head.innerHTML = ''; $('#mapWrap').hidden = true; return; }
  const hl = getHighlight();
  const all = computeList(hl);
  const N = state.settings.listCount;
  const byDist = all.slice().sort((a, b) => distKey(a) - distKey(b));
  let pool = byDist.slice(0, N);
  // 最近 N 間都不適合時，補上最近一間適合的醫院
  const extra = hl.active && !pool.some(x => x.m) ? (byDist.slice(N).find(x => x.m) || null) : null;
  if (extra) { extra.far = true; pool = pool.concat(extra); }
  const rec = localCfg.sortBy !== 'dist';
  let ordered;
  if (rec) {
    pool.forEach(x => { x.tier = tierOf(x, hl); });
    ordered = pool.slice().sort((a, b) => a.tier - b.tier || distKey(a) - distKey(b));
  } else ordered = pool;
  ordered.forEach((x, i) => { x.rank = i + 1; });
  const shown = hl.active && state.onlyMatch ? ordered.filter(x => x.m) : ordered;
  const matchCount = pool.filter(x => x.m).length;

function whyNot(x, hl) {
  const out = [];
  const av = availCaps(x.h);
  const capIssue = ids => ids.filter(c => !av.has(c)).map(c => {
    const stt = capState(x.h, c);
    if (stt === 'no') return `沒有${capName(c)}`;
    if (stt === 'closed') return `${capName(c)}現在不是服務時段（${hoursText(x.h.limits[c].when)}）`;
    if (stt === 'novent') return `${capName(c)}不收插管／呼吸器病人`;
    return `${capName(c)}忙碌或暫停中`;
  });
  if (!x.m) {
    if (state.tab === 'quick') out.push(...capIssue([...state.quickCaps]));
    else {
      const r = activeRule();
      const g = r ? applicableGroups(r, state.patient.sex, ageVal()).groups[0] : null;
      if (g) {
        if (g.exclude.includes(x.h.id)) out.push('已被設定為排除');
        if (g.minLevel && levelRank(x.h.level) < levelRank(g.minLevel)) out.push(`等級不足（${x.h.level || '未分級'}）`);
        out.push(...capIssue(g.caps));
      }
    }
  } else {
    if (x.load === 'full' || x.load === 'high') out.push(LOAD_TXT[x.load]);
    if (x.win && x.win.closed) out.push('到院時已超過時間窗');
  }
  return out.length ? out : ['不符合條件'];
}

function geoErrMsg(err) {
  if (!err) return '定位失敗';
  if (err.code === 1) return '定位權限被拒絕，請到「設定 › Safari › 位置」允許，或改用下拉選單選擇出發點';
  if (err.code === 2) return '目前無法取得位置訊號，請改用下拉選單選擇出發點';
  if (err.code === 3) return '定位逾時，請再試一次或改用下拉選單';
  return '定位失敗：' + (err.message || '');
}
function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('此瀏覽器不支援定位（需使用 https 網址）'));
    navigator.geolocation.getCurrentPosition(p => {
      state.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      state.posLabel = `GPS 定位 ±${Math.round(p.coords.accuracy)} m・${fmtClock(Date.now())}`;
      renderLoc(); resolve();
    }, err => reject(new Error(geoErrMsg(err))), { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 });
  });
}

const Speech = {
  rec: null, on: false, base: '',
  supported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  toggle() {
    if (this.on) { this.stop(); return; }
    if (!this.supported()) throw new Error('這個瀏覽器不支援語音輸入。iPhone 請用 Safari，或用鍵盤上的麥克風聽寫');
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = this.rec = new R();
    rec.lang = 'zh-TW'; rec.interimResults = true; rec.continuous = true;
    this.base = state.caseText ? state.caseText.replace(/\s*$/, '') + ' ' : '';
    rec.onresult = ev => {
      let txt = '';
      for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      setCaseText(this.base + txt);
    };
    rec.onerror = ev => { toast(ev.error === 'not-allowed' ? '麥克風權限被拒絕，請到設定允許' : '語音辨識中斷：' + ev.error); this.stop(); };
    rec.onend = () => { if (this.on) { this.on = false; renderMic(); } };
    rec.start(); this.on = true; renderMic();
  },
  stop() { try { if (this.rec) this.rec.stop(); } catch (e) { /* ignore */ } this.on = false; renderMic(); }
};
function renderMic() {
  const b = $('#micBtn'); if (!b) return;
  b.classList.toggle('rec', Speech.on);
  b.innerHTML = `${ic('mic', 'sm')}${Speech.on ? '停止' : '說話'}`;
  b.setAttribute('aria-pressed', Speech.on ? 'true' : 'false');
}


/* ========== 救護車位置回傳（醫院端看板用） ========== */
const Tracker = {
  watchId: null, last: null, timer: null,
  active() {
    const now = Date.now();
    return state.myNotices.filter(n => ['pending', 'accepted'].includes(n.status) && !n.arrivedAt && now - n.createdAt < 2 * 3600e3);
  },
  start() { if (!this.timer) this.timer = setInterval(() => this.tick().catch(e => console.warn('位置回傳失敗', e)), 15000); },
  ensureWatch(on) {
    if (on && this.watchId == null && navigator.geolocation) {
      this.watchId = navigator.geolocation.watchPosition(p => { this.last = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now() }; },
        () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
    } else if (!on && this.watchId != null) { navigator.geolocation.clearWatch(this.watchId); this.watchId = null; }
  },
  async tick() {
    const list = this.active();
    const useGps = state.locSource === 'gps';
    this.ensureWatch(list.length > 0 && useGps);
    const now = Date.now();
    for (const n of list) {
      const h = hospById(n.hid); if (!h) continue;
      let pos = null, etaAt = null;
      if (useGps && this.last && now - this.last.at < 60000) {
        pos = { lat: this.last.lat, lng: this.last.lng };
        etaAt = now + estMin(distKm(pos, h)) * 60e3;
      } else if (localCfg.sim && n.origin && n.eta) {
        // 示範：沿直線從出發點開往醫院
        const f = Math.min(1, (now - n.createdAt) / (n.eta * 60e3));
        pos = { lat: n.origin.lat + (h.lat - n.origin.lat) * f, lng: n.origin.lng + (h.lng - n.origin.lng) * f };
        etaAt = n.createdAt + n.eta * 60e3;
      }
      if (!pos) continue;
      const patch = { pos, posAt: now, etaAt };
      if (distKm(pos, h) < 0.2) patch.arrivedAt = now;
      await Store.updateNotice(n.id, patch);
    }
  }
};

/* ========== 大量傷病患分流 ========== */
const MCI_TYPES = { general: '一般', trauma: '創傷', burn: '燒燙傷', co: '火災／一氧化碳' };
const MCI_COLORS = [['red', '紅', '危急'], ['yellow', '黃', '緊急'], ['green', '綠', '輕傷']];
// 各院可收治人數：依醫院等級估計（開啟即時量能時，才用醫院回報的急救室空位修正）
function mciCapacity(h) {
  const st = SHOW_CAPACITY ? liveStatus(h.id) : null, lr = levelRank(h.level);
  let red = st && st.resusMax != null ? Math.max(0, st.resusMax - (st.resus || 0)) : [1, 2, 3][lr] ?? 0;
  let yellow = [2, 4, 6][lr] ?? 1, green = [6, 8, 10][lr] ?? 4;
  if (st) {
    yellow = Math.max(0, yellow - Math.floor((st.waitBed || 0) / 5));
    if (st.icuBeds === 0) red = Math.min(red, 1);
    if (st.erFull) { red = 0; yellow = Math.min(yellow, 1); green = Math.min(green, 2); }
  }
  return { red, yellow, green };
}
function mciEligible(h, color, type) {
  const lr = levelRank(h.level);
  if (color === 'red') return type === 'trauma' ? lr === 2 && availCaps(h).has('TRAUMA') : lr >= 1;
  if (color === 'yellow') return type === 'trauma' ? lr >= 1 : lr >= 0;
  return true;
}
function mciPreferred(h, color, type) {
  const av = availCaps(h);
  if (type === 'burn' && color !== 'green') return av.has('BURN');
  if (type === 'co' && color !== 'green') return av.has('HBO');
  return true;
}
// 分配演算法（貪婪法）：由重到輕逐一指派到「成本」最低的醫院
// 成本 = 車程 + 已分配人數 × 分散係數（避免全部送同一間）＋ 沒有專科能力的懲罰
function mciAllocate(input) {
  const SPREAD = 5, NOPREF = 20, MAX_ETA = 60;
  const pool = state.hospitals.filter(h => h.lat != null && h.lng != null && h.level)
    .map(h => { const d = distKm(state.pos, h); const e = state.eta[h.id]; return { h, d, eta: e ? e.min : estMin(d), cap: mciCapacity(h), got: { red: 0, yellow: 0, green: 0 }, n: 0 }; })
    .filter(x => x.eta <= MAX_ETA).sort((a, b) => a.eta - b.eta);
  const unassigned = { red: 0, yellow: 0, green: 0 };
  MCI_COLORS.forEach(([c]) => {
    for (let i = 0; i < input[c]; i++) {
      let best = null, bestCost = Infinity;
      pool.forEach(x => {
        if (!mciEligible(x.h, c, input.type) || x.got[c] >= x.cap[c]) return;
        const cost = x.eta + x.n * SPREAD + (mciPreferred(x.h, c, input.type) ? 0 : NOPREF);
        if (cost < bestCost) { bestCost = cost; best = x; }
      });
      if (best) { best.got[c]++; best.n++; } else unassigned[c]++;
    }
  });
  const used = pool.filter(x => x.n > 0);
  // 對照：全部送最近一間能收危急傷患的醫院
  const nearest = pool.find(x => mciEligible(x.h, 'red', input.type)) || pool[0] || null;
  const total = input.red + input.yellow + input.green;
  const nearCap = nearest ? nearest.cap.red + nearest.cap.yellow + nearest.cap.green : 0;
  const lastRed = used.filter(x => x.got.red).reduce((m, x) => Math.max(m, x.eta), 0);
  return { used, unassigned, nearest, total, nearCap, lastRed, at: Date.now(), input: { ...input } };
}

async function mciRun() {
  const btn = document.querySelector('[data-act="mciRun"]');
  const m = state.mci;
  if (m.red + m.yellow + m.green === 0) throw new Error('請輸入傷患人數');
  setRunning(true);
  try {
    if (!state.pos || state.locSource === 'gps') { if (btn) btn.querySelector('span').textContent = '定位中…'; await locate(); }
    await fetchEta(state.pos, state.hospitals.filter(h => h.lat != null).map(h => ({ h, d: distKm(state.pos, h) })).sort((a, b) => a.d - b.d));
    m.result = mciAllocate(m); m.batch = '';
    logEvent({ type: 'mci', total: m.result.total, hospitals: m.result.used.length });
    renderMci();
    const o = $('#mciOut'); if (o) window.scrollTo({ top: o.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
  } finally { setRunning(false); if (btn && document.body.contains(btn)) btn.querySelector('span').textContent = '計算分流'; }

  for (const x of r.used) {

// 情境時間：平日白天、平日晚上、深夜、週末（醫院有些能力只有白天或平日做得到）
const SCN_TIMES = [
  ['平日白天', [1, 2, 3, 4, 5], 8 * 60, 17 * 60], ['平日晚上', [1, 2, 3, 4, 5], 18 * 60, 23 * 60 + 50],
  ['深夜', [0, 1, 2, 3, 4, 5, 6], 0, 6 * 60], ['週六', [6], 7 * 60, 22 * 60], ['週日', [0], 7 * 60, 22 * 60]
];
function scnRandomTime() {
  const [kind, days, a, b] = scnPick(SCN_TIMES), day = scnPick(days);
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + ((day - d.getDay() + 7) % 7));
  d.setHours(0, scnInt(a, b - 1));
  return { ts: d.getTime(), kind };
}
let scnLast = -1;
function randomScenario() {
  let i; do { i = Math.floor(Math.random() * SCENARIOS.length); } while (SCENARIOS.length > 1 && i === scnLast);
  scnLast = i;
  const sc = SCENARIOS[i];
  const pl = sc.places ? (SCENE_PLACES.find(p => p[0] === scnPick(sc.places)) || scnPick(SCENE_PLACES)) : scnPick(SCENE_PLACES);
  const tm = scnRandomTime();
  state.scn = { title: sc.t, place: pl[0], time: tm.ts, kind: tm.kind };
  state.pos = { lat: +(pl[1] + (Math.random() - 0.5) * 0.012).toFixed(5), lng: +(pl[2] + (Math.random() - 0.5) * 0.012).toFixed(5) };
  state.posLabel = `情境現場：新北市${pl[0]}`; state.locSource = 'manual';
  state.searched = false; state.eta = {}; state.etaState = ''; state.etaKey = '';
  AI.cancel(); state.ai = { state: 'idle' }; state.lastParsed = null; state.patient = { sex: '', age: '', ruleId: '' }; resetClock();
  state.tab = 'patient';
  renderMain();
  setCaseText(sc.gen().replace(/\s+/g, ' ').trim());
}
function endScenario(keepPos) {
  if (!state.scn) return;
  state.scn = null;
  if (!keepPos && state.locSource === 'manual' && state.posLabel.startsWith('情境現場')) {
    state.locSource = 'gps'; state.pos = null; state.searched = false;
  }
  if (isRoute('')) renderMain();
}
function renderScnBar() {
  const box = $('#scnBar'); if (!box) return;
  const c = state.scn;
  box.innerHTML = c ? `<div class="scn">${ic('dice')}<div class="t"><b>隨機情境：${esc(c.title)}</b>
      <small>新北市${esc(c.place)}・${fmtScnTime(c.time)}（${esc(c.kind)}）・醫院服務時段依情境時間判斷</small></div>
      <div class="b"><button class="btn sm" data-act="randomCase">${ic('refresh', 'sm')}換一題</button><button class="btn sm ghost" data-act="endScn">結束</button></div></div>` : '';
}

/* ========== 醫院能力表（單一醫院）與能力總表 ========== */
function markHtml(ch) {
  return { '●': '<i class="mk y">●</i>', '★': '<i class="mk s">★</i>', '無': '<i class="mk n">無</i>' }[ch] || '<i class="mk e">－</i>';
}
function capChip(h, c, d) {
  const n = capName(c), l = h.limits[c], stt = capState(h, c, d);
  if (stt === 'no') return `<span class="cs no">${esc(n)}・無</span>`;
  const txt = { ok: l && l.when ? hoursText(l.when) : '24 小時', ask: '有條件', closed: `現在不能做（${l ? hoursText(l.when) : ''}）`,
    novent: '不收呼吸器病人', paused: '長期停用', live: '醫院回報忙碌' }[stt];
  const cls = { ok: l && l.when ? 'lim' : 'ok', ask: 'ask' }[stt] || 'off';
  return `<span class="cs ${cls}">${esc(n)}・${esc(txt)}</span>${l && l.note ? `<span class="cs-note">${esc(l.note)}</span>` : ''}`;
}
// 單一醫院的能力表內容：19 個欄位（標記、此刻狀態、原文說明）；showNone=false 時只列有提供的欄位
function hospTableRows(h, d = capNow(), showNone = true) {
  const groups = [];
  TABLE_CATS.forEach(cat => {
    const t = h.table[cat.id] || { m: '---', t: '' };
    const caps = cat.caps.filter(c => capById(c));
    const has = caps.some(c => h.caps.includes(c));
    if (!has && !showNone) return;
    const row = `<div class="ht-row ${has ? '' : 'none'}">
      <div class="ht-k"><b>${esc(cat.name)}</b><span class="ht-m" title="人力／照護設備／編制床">${[...t.m].map(markHtml).join('')}</span></div>
      <div class="ht-v"><div class="cs-wrap">${caps.map(c => capChip(h, c, d)).join('')}</div>${t.t && t.t !== '無' ? `<p>${esc(t.t)}</p>` : ''}</div></div>`;
    const last = groups[groups.length - 1];
    if (cat.grp && last && last.g === cat.grp) last.rows.push(row); else groups.push({ g: cat.grp, rows: [row] });
  });
  const other = h.caps.filter(c => capById(c) && !TABLE_CATS.some(t => t.caps.includes(c)));
  if (other.length) groups.push({ g: '其他能力', rows: [`<div class="ht-row"><div class="ht-k"><b>自訂能力</b></div><div class="ht-v"><div class="cs-wrap">${other.map(c => capChip(h, c, d)).join('')}</div></div></div>`] });
  return { n: groups.reduce((a, g) => a + g.rows.length, 0), html: groups.map(g => (g.g ? `<div class="ht-grp">${esc(g.g)}</div>` : '') + g.rows.join('')).join('') };
}
function tableLegend(d) {
  return `標記依序為 人力／照護設備／編制床（● 具備、★ 不分科編制床）；狀態依${state.scn ? '情境時間 ' + fmtScnTime(state.scn.time) : '現在時間 ' + fmtScnTime(d)}判斷`;
}

// 能力總表的一格：● 24 小時、◐ 有時段或條件、空白 無；現在做不到的變灰
function catCell(h, cat, d) {
  const present = cat.caps.filter(c => h.caps.includes(c));
  if (!present.length) return { k: 'no', sym: '' };
  const limited = !h.caps.includes(cat.caps[0]) || present.some(c => h.limits[c] && h.limits[c].when);
  const off = present.every(c => !['ok', 'ask'].includes(capState(h, c, d)));
  const note = present.map(c => h.limits[c]).filter(l => l && (l.when || l.note))
    .map(l => [l.when ? hoursText(l.when) : '', l.note].filter(Boolean).join('：')).join('；');
  return { k: (limited ? 'part' : 'ok') + (off ? ' off' : ''), sym: `<i class="dt ${limited ? 'part' : 'ok'}"></i>`, note };
}
function renderMatrix() {
  const box = $('#matrixBox'); if (!box) return;
  const d = capNow();
  const hs = state.hospitals.slice().sort((a, b) => levelRank(b.level) - levelRank(a.level) || a.id.localeCompare(b.id));
  const groups = [];
  TABLE_CATS.forEach(c => { const last = groups[groups.length - 1]; if (c.grp && last && last.g === c.grp) last.cats.push(c); else groups.push({ g: c.grp, cats: [c] }); });
  const head1 = groups.map(g => g.g ? `<th colspan="${g.cats.length}" class="grp">${esc(g.g)}</th>` : `<th rowspan="2" class="cat">${esc(g.cats[0].short)}</th>`).join('');
  const head2 = groups.filter(g => g.g).flatMap(g => g.cats).map(c => `<th class="cat">${esc(c.short)}</th>`).join('');
  let lastLv = null;
  const rows = hs.map(h => {
    const lv = h.level || '未分級';
    const sep = lv !== lastLv ? `<tr class="lvrow"><td colspan="${TABLE_CATS.length + 1}"><span class="h-lv l${levelRank(h.level)}">${esc(lv)}</span></td></tr>` : '';
    lastLv = lv;
    return sep + `<tr><th class="hn"><button data-act="hospTable" data-id="${esc(h.id)}">${esc(h.short || h.name)}</button></th>${TABLE_CATS.map(cat => {
      const c = catCell(h, cat, d);
      return `<td class="mx ${c.k}" ${c.sym ? `data-act="hospTable" data-id="${esc(h.id)}"` : ''} title="${esc(cat.name + (c.note ? '：' + c.note : ''))}">${c.sym}</td>`;
    }).join('')}</tr>`;
  }).join('');
  box.innerHTML = `<div class="mx-top"><div><b>急救責任醫院能力總表</b><small>${esc(state.settings.tableSrc)}</small></div>
      <div class="mx-legend"><span><i class="dt ok"></i>24 小時</span><span><i class="dt part"></i>有時段或條件</span><span class="off"><i class="dt ok"></i>${state.scn ? '情境時間' : '現在'}不能做（非服務時段或醫院回報忙碌）</span></div></div>
    <div class="mx-note">點醫院名稱或格子，看該院的人力／設備／編制床與原文說明。狀態依${state.scn ? '情境時間 ' + fmtScnTime(state.scn.time) : '現在時間 ' + fmtScnTime(Date.now())}判斷。</div>
    <div class="mx-wrap"><table class="mx-t"><thead><tr><th rowspan="2" class="hn">醫院</th>${head1}</tr><tr>${head2}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ========== 數據分析 ========== */
const STAT_RANGES = [[7, '近 7 天'], [30, '近 30 天'], [90, '近 90 天']];
function demoHistory() { return readLS(DEMO_HIST_KEY) || { logs: [], notices: [] }; }
// 產生 30 天示範數據（只存在這台裝置，標示為示範）
function genDemoHistory(days = 30) {
  const rnd = Math.random, pick = (arr, w) => { let t = w.reduce((a, b) => a + b, 0) * rnd(); for (let i = 0; i < arr.length; i++) { t -= w[i]; if (t <= 0) return arr[i]; } return arr[arr.length - 1]; };
  const hourW = [2, 1.5, 1.2, 1, 1, 1.2, 2, 3, 4, 5, 5, 4.5, 4, 4, 4.2, 4.5, 4.8, 5.2, 5.5, 5.4, 5, 4.2, 3.4, 2.6];
  const rules = state.rules.filter(r => r.groups.length);
  const ruleW = rules.map(r => ({ r07: 6, r01: 5, r02: 5, r05: 5, r09: 4, r13: 3, r20: 3, r11: 3, r03: 2 }[r.id] || 1.2));
  const hosps = state.hospitals.filter(h => h.level);
  const hospW = hosps.map(h => [1, 2.5, 5][levelRank(h.level)] || 1);
  const logs = [], notices = [], now = Date.now();
  for (let d = 0; d < days; d++) {
    const n = 14 + Math.floor(rnd() * 14);
    for (let i = 0; i < n; i++) {
      const hr = pick([...Array(24).keys()], hourW);
      const t = new Date(now - d * 864e5); t.setHours(hr, Math.floor(rnd() * 60), 0, 0);
      if (t.getTime() > now) continue;
      const r = pick(rules, ruleW);
      logs.push({ type: 'search', at: t.getTime(), tab: 'patient', ruleId: r.id, ruleName: r.name, demo: true });
      if (rnd() < 0.45) {
        const h = pick(hosps, hospW);
        const declineP = [0.08, 0.14, 0.24][levelRank(h.level)] + (hr >= 18 || hr < 2 ? 0.08 : 0);
        const declined = rnd() < declineP;
        const delay = Math.max(0.3, Math.exp(0.4 + rnd() * 1.6)) * 60e3;
        const reason = declined ? pick(DECLINE_REASONS, [5, 3, 3, 2, 1, 2]) : '可收治，已準備';
        notices.push(normNotice({ id: uid('dn'), hid: h.id, hospitalName: h.short || h.name, unit: '示範', creatorUid: 'demo',
          createdAt: t.getTime() + 60e3, eta: 5 + Math.floor(rnd() * 15), patient: r.name, status: declined ? 'declined' : 'accepted',
          reply: reason, repliedAt: t.getTime() + 60e3 + delay, demo: true }));
      }
    }
  }
  writeLS(DEMO_HIST_KEY, { logs, notices });
  return { logs: logs.length, notices: notices.length };
}
async function loadStatsData() {
  const [logs, notices] = await Promise.all([Store.loadLogs(), Store.loadAllNotices()]);
  const hist = demoHistory();
  return { logs: logs.concat(hist.logs || []), notices: notices.concat((hist.notices || []).map(normNotice)), hasDemo: !!(hist.logs || []).length };
}
function hbars(rows, opts = {}) {
  if (!rows.length) return '<div class="empty">這段期間沒有資料</div>';
  const max = Math.max(...rows.map(r => r.v)) || 1;
  return `<div class="hb">${rows.map(r => `<div class="hb-r" title="${esc(r.k)}：${r.v}${opts.unit || ''}">
    <span class="hb-k">${esc(r.k)}</span>
    <span class="hb-t"><span class="hb-track"><span class="hb-b" style="width:${Math.max(1.5, r.v / max * 100)}%"></span></span><b class="num">${opts.fmt ? opts.fmt(r.v) : r.v}${opts.unit || ''}</b></span>
  </div>`).join('')}</div>`;
}
async function renderStats() {
  const p = $('#adminPanel');
  p.innerHTML = '<div class="empty">載入數據中…</div>';
  let data;
  try { data = await loadStatsData(); } catch (e) { p.innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  if (state.adminTab !== 'stats') return;
  const days = state.statRange || 30, since = Date.now() - days * 864e5;
  const logs = data.logs.filter(l => l.at >= since);
  const searches = logs.filter(l => l.type === 'search');
  const ns = data.notices.filter(n => n.createdAt >= since && n.status !== 'cancelled');
  const replied = ns.filter(n => n.repliedAt && ['accepted', 'declined'].includes(n.status));
  const accepted = replied.filter(n => n.status === 'accepted');
  const avgReply = replied.length ? replied.reduce((a, n) => a + (n.repliedAt - n.createdAt), 0) / replied.length / 60e3 : null;
  const tile = (label, val, sub) => `<div class="kpi"><span>${label}</span><b class="num">${val}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  // 每小時
  const hours = Array(24).fill(0); searches.forEach(l => { hours[new Date(l.at).getHours()]++; });
  const hmax = Math.max(...hours) || 1, peak = hours.indexOf(Math.max(...hours));
  const cols = hours.map((v, h) => `<div class="col-c" title="${h} 點：${v} 次">
      <span class="col-b" style="height:${Math.max(v ? 3 : 0, v / hmax * 100)}%">${h === peak && v ? `<em class="num">${v}</em>` : ''}</span></div>`).join('');
  // 主訴
  const byRule = {}; searches.forEach(l => { if (l.ruleName) byRule[l.ruleName] = (byRule[l.ruleName] || 0) + 1; });
  const ruleRows = Object.entries(byRule).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v).slice(0, 10);
  // 醫院
  const byH = {};
  ns.forEach(n => { const o = byH[n.hid] || (byH[n.hid] = { name: n.hospitalName, n: 0, a: 0, d: 0, delay: 0, r: 0 });
    o.n++; if (n.status === 'accepted') o.a++; if (n.status === 'declined') o.d++; if (n.repliedAt) { o.delay += n.repliedAt - n.createdAt; o.r++; } });
  const hRows = Object.values(byH).sort((a, b) => b.n - a.n).slice(0, 12);
  // 拒收原因
